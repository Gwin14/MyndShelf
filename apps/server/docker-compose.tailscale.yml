# Opcional: o próprio container entra no tailnet como "myndshelf" e serve HTTPS
# (https://myndshelf.<seu-tailnet>.ts.net), sem precisar do Tailscale no host.
#   docker compose -f docker-compose.yml -f docker-compose.tailscale.yml up -d --build
# Precisa de TS_AUTHKEY no .env (https://login.tailscale.com/admin/settings/keys)
# e de HTTPS ligado no tailnet (Admin → DNS → HTTPS Certificates).
services:
  tailscale:
    image: tailscale/tailscale:stable
    hostname: myndshelf
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - tailscale:/var/lib/tailscale
      - ./tailscale-serve.json:/config/serve.json:ro

  myndshelf:
    network_mode: service:tailscale
    ports: !reset []
    depends_on: [tailscale]

volumes:
  tailscale:
